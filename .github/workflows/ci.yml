name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    name: ${{ matrix.check.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        check:
          - name: bun test
            command: bun test
          - name: bun run typecheck
            command: bun run typecheck
          - name: route smoke test
            command: bun run test:routes
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: ${{ matrix.check.command }}

  accessibility:
    name: accessibility acceptance evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: npm install --prefix tests/accessibility --ignore-scripts --package-lock=false
      - run: cd tests/accessibility && npx playwright install --with-deps chromium
      - run: bun run test:a11y
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-evidence
          path: artifacts/accessibility
          if-no-files-found: error
