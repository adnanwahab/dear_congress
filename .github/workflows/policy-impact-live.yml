name: Read-only deployed policy acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix tests/accessibility --ignore-scripts --package-lock=false
      - run: cd tests/accessibility && npx playwright install --with-deps chromium
      - run: bun run test:policy-impact-live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployed-policy-impact-evidence
          path: artifacts/policy-impact-live
          if-no-files-found: error
