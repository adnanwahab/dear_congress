# fly.toml app configuration file generated for dear-congress on 2026-10-22T21:04:43-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'dear-congress'
primary_region = 'iad'

[build]
[env]
  DB_PATH = '/data/db.json'
  NODE_ENV = 'production'

[[mounts]]
  source = 'civic_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
