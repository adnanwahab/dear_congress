# fly.toml app configuration file for civic-synthesis on 2026-10-22T21:04:43-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'civic-synthesis'
primary_region = 'iad'

[build]
[env]
  DB_PATH = '/data/db.json'
  NODE_ENV = 'production'
  DEBUG_REQUEST_LOGS = '0'
  HBL_SINGLE_WRITER = '1'
  HBL_PUBLIC_ORIGIN = 'https://civic-synthesis.fly.dev'
  HBL_DB_PATH = '/data/db.json.hbl.sqlite'
  FRAME_ANCESTORS = "*"

[[mounts]]
  source = 'civic_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024

[[http_service.checks]]
  grace_period = "20s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/healthz"

# CSP is applied by the server so /embed can use its explicit frame policy.
[http_service.http_options.response.headers]
  Strict-Transport-Security = "max-age=31536000"
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "no-referrer"
