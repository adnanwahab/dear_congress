# fly.toml app configuration file generated for dear-congress on 2026-10-22T21:04:43-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'dear-congress'
primary_region = 'iad'

[build]
[env]
  HBL_SINGLE_WRITER = '1'
  HBL_PUBLIC_ORIGIN = 'https://civic-synthesis.fly.dev'
  HBL_DB_PATH = '/data/db.json.hbl.sqlite'
  DB_PATH = '/data/db.json'
  NODE_ENV = 'production'
  FRAME_ANCESTORS = "'self'"
  TRUST_FLY_PROXY = "1"

[[mounts]]
  source = 'civic_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

# Internal routing health; external alert delivery is configured separately.
[[http_service.checks]]
  grace_period = '30s'
  interval = '30s'
  timeout = '5s'
  method = 'GET'
  path = '/healthz'

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024

# Apply to HTML/bundled assets as well as API responses.
[http_service.http_options.response.headers]
  Strict-Transport-Security = "max-age=31536000"
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "no-referrer"
  Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://basemaps.cartocdn.com https://*.basemaps.cartocdn.com; connect-src 'self' https://basemaps.cartocdn.com https://*.basemaps.cartocdn.com https://*.bugsnag.com; worker-src 'self' blob:; font-src 'self' data: https://basemaps.cartocdn.com https://*.basemaps.cartocdn.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
